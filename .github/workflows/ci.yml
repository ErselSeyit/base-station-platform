name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Build & Test
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ${{ secrets.CI_TEST_DB_PASSWORD || 'test_ci_ephemeral' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile -DskipTests -B

      - name: Run tests in demo mode
        run: mvn test -B -Ddemo.mode=true
        env:
          DEMO_MODE: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'

  # ============================================
  # Edge bridge (Go)
  # ============================================
  edge-bridge:
    name: Edge Bridge (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: edge-bridge/go.sum

      - name: Vet
        working-directory: edge-bridge
        run: go vet ./...

      - name: Test (race detector)
        working-directory: edge-bridge
        run: go test -race ./...

  # ============================================
  # Device protocol (C)
  # ============================================
  device-protocol:
    name: Device Protocol (C)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and test (release, hardened)
        run: make -C device-protocol-c test

      - name: Build and test (debug)
        run: make -C device-protocol-c clean && make -C device-protocol-c DEBUG=1 test

      - name: Install mbedTLS and build with TLS enabled
        run: |
          sudo apt-get update && sudo apt-get install -y libmbedtls-dev
          make -C device-protocol-c clean && make -C device-protocol-c TLS=1

  # ============================================
  # Container images build (test what we deploy)
  # ============================================
  image-build:
    name: Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the images whose Dockerfiles have historically broken (Go
      # toolchain version, Python import path, Java multi-stage). Direct
      # `docker build` with the repo root as context avoids the compose
      # variable interpolation that a bare `docker compose build` would trip.
      - name: Build edge-bridge image (Go)
        run: docker build -f edge-bridge/Dockerfile -t ci/edge-bridge edge-bridge

      - name: Build ai-diagnostic image (Python)
        run: docker build -f ai-diagnostic/Dockerfile -t ci/ai-diagnostic ai-diagnostic

      - name: Build monitoring-service image (Java multi-stage)
        run: docker build -f monitoring-service/Dockerfile -t ci/monitoring-service .

      - name: Build tmf-api image (Java multi-stage)
        run: docker build -f tmf-api/Dockerfile -t ci/tmf-api .

  # ============================================
  # AI diagnostic (Python)
  # ============================================
  ai-diagnostic:
    name: AI Diagnostic (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ai-diagnostic
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        working-directory: ai-diagnostic
        run: python -m pytest tests/ -q

  # ============================================
  # Frontend
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings=0

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

  # ============================================
  # Code Quality
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Check code compilation warnings
        run: mvn clean compile -B

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Warm the local Maven cache so Trivy resolves POMs from ~/.m2 instead of
      # hammering Maven Central, which rate-limits (429) and fails the scan.
      - name: Populate Maven cache
        run: mvn -B -q dependency:go-offline || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  # ============================================
  # Helm Chart Lint
  # ============================================
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart (default values)
        run: helm lint helm/basestation-platform

      - name: Lint chart (dev values)
        run: helm lint helm/basestation-platform -f helm/basestation-platform/values-dev.yaml

      - name: Lint chart (prod values)
        run: helm lint helm/basestation-platform -f helm/basestation-platform/values-prod.yaml

      - name: Template renders without errors
        run: helm template basestation helm/basestation-platform > /dev/null

