spring:
  datasource:
    url: jdbc:h2:mem:basestation-it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: 0

monitoring:
  service:
    url: http://localhost:0

# InternalAuthFilter lives in the common package, which these tests now scan
# (matching BaseStationServiceApplication). It rejects every request unless a
# shared secret is configured, so it must be disabled for tests.
security:
  internal:
    enabled: false
