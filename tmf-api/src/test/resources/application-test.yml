spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/tmf_test
      auto-index-creation: true

  security:
    enabled: false

# The InternalAuthFilter (HMAC gateway gate) needs a shared secret it does not
# have in tests, so disable it here; the controller slice tests use
# TestSecurityConfig for authorization instead.
security:
  internal:
    enabled: false

logging:
  level:
    io.github.erselseyit.basestation.tmf: DEBUG
    org.springframework.data.mongodb: DEBUG
