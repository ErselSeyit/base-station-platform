spring:
  application:
    name: monitoring-service-test
  data:
    mongodb:
      # Fallback only. Tests that need a real MongoDB import
      # MongoTestContainerConfig, whose @ServiceConnection container overrides
      # this URI. Do not point it at a shared or compose-managed MongoDB:
      # doing so made the suite depend on host state and fail against the
      # project's own docker-compose stack, which enables authentication.
      uri: mongodb://localhost:27017/test-monitoring

# Disable internal authentication for tests
security:
  internal:
    enabled: false

# Demo mode configuration - integration tests check this to skip if Docker unavailable
demo:
  mode: ${demo.mode:false}
