{{- $db := .Values.databases.postgres }}
{{- if and $db.enabled (not (default false (dig "ha" "enabled" false $db))) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "basestation.labels" (dict "root" . "name" "postgres") | nindent 4 }}
    tier: database
    component: postgres
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
        component: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: {{ $db.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $db.port }}
              protocol: TCP
          env:
            {{- range $key, $val := $db.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $ref := $db.envFromSecrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secret }}
                  key: {{ $ref.key }}
            {{- end }}
          resources:
            {{- toYaml $db.resources | nindent 12 }}
          securityContext:
            {{- toYaml (index .Values.securityPresets "relaxed") | nindent 12 }}
          livenessProbe:
            exec:
              command:
                {{- toYaml $db.probe.command | nindent 16 }}
            initialDelaySeconds: {{ $db.probe.livenessInitialDelay }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                {{- toYaml $db.probe.command | nindent 16 }}
            initialDelaySeconds: {{ $db.probe.readinessInitialDelay }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: {{ $db.dataPath }}
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "basestation.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: {{ $db.port }}
      targetPort: {{ $db.port }}
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ .Release.Namespace }}
data:
  init-multiple-dbs.sh: |
    {{ .Files.Get "files/postgres-init.sh" | nindent 4 }}
{{- end }}
