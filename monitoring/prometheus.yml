global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'base-station-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['base-station-service:8081']

  - job_name: 'monitoring-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['monitoring-service:8082']

  - job_name: 'notification-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8083']

  - job_name: 'auth-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8084']

  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']

  # The AI diagnostic service is a Flask app exposing prometheus_client
  # metrics at /metrics (not the Spring actuator path). Without this job its
  # diagnosis-duration, model-confidence, anomaly, healing and error metrics
  # are exposed but collected by no one.
  - job_name: 'ai-diagnostic'
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-diagnostic:9091']
